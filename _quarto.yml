  # hier UND unten unter book: chapters: ein. Die Fassungen vom Mai und vom
  # Online-Auftakt (28.10.2026) liegen unter _archiv/ bzw. in der Git-Historie.
  render:
    - index.qmd
    - parts/00-vorbereitung.qmd
    - parts/galerie.qmd
    - parts/01-didaktik.qmd
    - parts/02-setup.qmd
    - parts/03b-bilder-tabellen.qmd
    - parts/03a-uebersicht.qmd
    - parts/03c-style.qmd
    - parts/04-charts.qmd
    - parts/05-iframes-tutor.qmd
    - parts/07-widgets-colab.qmd
    - parts/08-github-pages.qmd
    - parts/06-slides-optional.qmd
    - parts/11-kurs-mit-agent.qmd
    - parts/12-oeffentlich-intern.qmd
    - appendix/troubleshooting.qmd
    - appendix/tutor-prompt.qmd
    - appendix/reviewer-prompt.qmd
